apiVersion: apps/v1
kind: Deployment
metadata:
  name: pantry
  namespace: pantry
  labels:
    app.kubernetes.io/name: pantry
    app.kubernetes.io/part-of: pantry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pantry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pantry
        app.kubernetes.io/part-of: pantry
    spec:
      # Explicit: removing serviceAccountName leaves the deprecated
      # serviceAccount field behind on the live object, which re-sets it
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pantry
          image: ghcr.io/pharmlovex/pantry:sha-3a595db
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            # DB connect_timeout is 3s; default probe timeout (1s) is too short
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
