# Exposed on the tailnet by the Tailscale Kubernetes operator
# at https://stirling-pdf.<tailnet-name>.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
  labels:
    app.kubernetes.io/name: stirling-pdf
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: stirling-pdf
      port:
        name: http
  tls:
    - hosts:
        - stirling-pdf
