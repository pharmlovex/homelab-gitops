apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale
  namespace: stirling-pdf
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale
  namespace: stirling-pdf
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tailscale-state"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale
  namespace: stirling-pdf
subjects:
  - kind: ServiceAccount
    name: tailscale
    namespace: stirling-pdf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tailscale
