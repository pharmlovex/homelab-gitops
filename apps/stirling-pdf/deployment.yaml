apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
  labels:
    app.kubernetes.io/name: stirling-pdf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stirling-pdf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stirling-pdf
    spec:
      serviceAccountName: tailscale
      containers:
        - name: stirling-pdf
          image: stirlingtools/stirling-pdf:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SECURITY_ENABLELOGIN
              value: "false"
            - name: LANGS
              value: "en_GB"
          volumeMounts:
            - name: data
              mountPath: /configs
              subPath: configs
            - name: data
              mountPath: /customFiles
              subPath: customFiles
            - name: data
              mountPath: /pipeline
              subPath: pipeline
            - name: logs
              mountPath: /logs
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi

        # Tailscale sidecar: joins the tailnet and serves Stirling PDF over HTTPS
        # at https://stirling-pdf.<tailnet-name>.ts.net
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:latest
          env:
            - name: TS_HOSTNAME
              value: stirling-pdf
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: TS_AUTHKEY
                  optional: true
            - name: TS_KUBE_SECRET
              value: tailscale-state
            - name: TS_USERSPACE
              value: "true"
            - name: TS_SERVE_CONFIG
              value: /config/serve.json
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: tailscale-serve-config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stirling-pdf-data
        - name: logs
          emptyDir: {}
        - name: tailscale-serve-config
          configMap:
            name: tailscale-serve-config
